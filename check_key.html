<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kiểm tra Key Gemini</title>
    <style>
        body {
            font-family: sans-serif;
            padding: 20px;
        }

        .success {
            color: green;
            font-weight: bold;
        }

        .error {
            color: red;
            font-weight: bold;
        }

        code {
            background: #f0f0f0;
            padding: 2px 5px;
            border-radius: 4px;
        }
    </style>
</head>

<body>
    <h2>🔍 Đang kiểm tra Key của bạn...</h2>
    <div id="status">Đang kết nối...</div>
    <h3>Danh sách Model hỗ trợ:</h3>
    <ul id="modelList"></ul>

    <script>
        const API_KEY = 'AIzaSyAX5OlW_yRdYDoFjj--YIUkOD18UBX1Wm8'; // Key của bạn
        const URL = `https://generativelanguage.googleapis.com/v1beta/models?key=${API_KEY}`;

        async function checkKey() {
            const statusDiv = document.getElementById('status');
            const list = document.getElementById('modelList');

            try {
                const response = await fetch(URL);
                const data = await response.json();

                if (response.ok) {
                    statusDiv.innerHTML = `<span class="success">✅ Key hoạt động tốt!</span>`;

                    // Lọc ra các model Gemini
                    const models = data.models || [];
                    const geminiModels = models.filter(m => m.name.includes('gemini'));

                    if (geminiModels.length === 0) {
                        list.innerHTML = "<li>Không tìm thấy model Gemini nào (Key này có thể chỉ dùng cho PaLM cũ).</li>";
                    } else {
                        geminiModels.forEach(model => {
                            const li = document.createElement('li');
                            // Tô đậm các model flash hoặc pro
                            if (model.name.includes('flash') || model.name.includes('pro')) {
                                li.innerHTML = `<strong>${model.name}</strong> (Nên dùng)`;
                            } else {
                                li.innerText = model.name;
                            }
                            list.appendChild(li);
                        });
                    }
                } else {
                    statusDiv.innerHTML = `<span class="error">❌ Lỗi Key: ${data.error.message}</span>`;
                }
            } catch (error) {
                statusDiv.innerHTML = `<span class="error">❌ Lỗi kết nối: ${error.message}</span>`;
            }
        }

        checkKey();
    </script>
</body>

</html>
